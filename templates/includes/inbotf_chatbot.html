<style>
    #inbotf-chat-root {
        --inbotf-primary: #1e3a5f;
        --inbotf-primary-dark: #152a45;
        --inbotf-accent: #0d9488;
        --inbotf-accent-dark: #0f766e;
        --inbotf-surface: #f8fafc;
        --inbotf-border: #e2e8f0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        z-index: 1050;
    }
    #inbotf-chat-toggle {
        position: fixed;
        right: 24px;
        bottom: 24px;
        width: 58px;
        height: 58px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, var(--inbotf-primary), var(--inbotf-accent));
        color: #fff;
        font-size: 1.5rem;
        box-shadow: 0 8px 24px rgba(30, 58, 95, 0.35);
        cursor: pointer;
        z-index: 1051;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s ease;
    }
    #inbotf-chat-toggle:hover {
        transform: scale(1.05);
    }
    #inbotf-chat-panel {
        position: fixed;
        right: 24px;
        bottom: 94px;
        width: min(380px, calc(100vw - 32px));
        height: min(520px, calc(100vh - 120px));
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
        display: none;
        flex-direction: column;
        overflow: hidden;
        z-index: 1051;
        border: 1px solid var(--inbotf-border);
    }
    #inbotf-chat-panel.open {
        display: flex;
    }
    #inbotf-chat-header {
        background: linear-gradient(135deg, var(--inbotf-primary), var(--inbotf-primary-dark));
        color: #fff;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
    }
    #inbotf-chat-header h6 {
        margin: 0;
        font-weight: 700;
        font-size: 1rem;
    }
    #inbotf-chat-header small {
        opacity: 0.9;
        display: block;
        font-weight: 500;
    }
    #inbotf-chat-close {
        background: transparent;
        border: none;
        color: #fff;
        font-size: 1.25rem;
        line-height: 1;
        cursor: pointer;
        padding: 4px;
    }
    #inbotf-chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 14px;
        background: var(--inbotf-surface);
    }
    .inbotf-chat-msg {
        max-width: 88%;
        margin-bottom: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        font-size: 0.92rem;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
    }
    .inbotf-chat-msg.user {
        margin-left: auto;
        background: #dbeafe;
        color: #1e3a8a;
        border-bottom-right-radius: 4px;
    }
    .inbotf-chat-msg.bot {
        margin-right: auto;
        background: #fff;
        border: 1px solid var(--inbotf-border);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
        border-bottom-left-radius: 4px;
    }
    .inbotf-chat-msg img {
        max-width: 100%;
        border-radius: 8px;
        margin-top: 6px;
    }
    .inbotf-chat-msg.system {
        margin: 0 auto 10px;
        background: #fef3c7;
        color: #92400e;
        border: 1px solid #fde68a;
        font-size: 0.85rem;
        text-align: center;
        max-width: 100%;
    }
    #inbotf-chat-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 12px 0;
        background: #fff;
        border-top: 1px solid #eee;
    }
    #inbotf-chat-chips button {
        border: 1px solid #cbd5e1;
        background: #f1f5f9;
        color: #334155;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 0.78rem;
        cursor: pointer;
    }
    #inbotf-chat-chips button:hover {
        background: #e2e8f0;
        border-color: #94a3b8;
    }
    #inbotf-chat-form {
        display: flex;
        gap: 8px;
        padding: 10px 12px 12px;
        background: #fff;
        border-top: 1px solid #eee;
        align-items: center;
    }
    #inbotf-chat-input {
        flex: 1;
        border: 1px solid #ced4da;
        border-radius: 10px;
        padding: 8px 12px;
        font-size: 0.9rem;
    }
    #inbotf-chat-input:focus {
        outline: none;
        border-color: var(--inbotf-accent);
        box-shadow: 0 0 0 0.15rem rgba(13, 148, 136, 0.2);
    }
    #inbotf-chat-send,
    #inbotf-chat-image-btn {
        border: none;
        border-radius: 10px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 600;
    }
    #inbotf-chat-send {
        background: var(--inbotf-accent);
        color: #fff;
    }
    #inbotf-chat-send:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }
    #inbotf-chat-image-btn {
        background: #e9ecef;
        color: #495057;
    }
    #inbotf-chat-file {
        display: none;
    }
    #inbotf-chat-typing {
        font-size: 0.8rem;
        color: #6c757d;
        padding: 0 14px 8px;
        display: none;
    }
</style>

<div id="inbotf-chat-root" aria-live="polite">
    <button type="button" id="inbotf-chat-toggle" title="Asistente INBOTF" aria-label="Abrir asistente">
        <i class="bi bi-chat-dots-fill"></i>
    </button>
    <div id="inbotf-chat-panel" role="dialog" aria-label="Chat INBOTF">
        <div id="inbotf-chat-header">
            <div>
                <h6>Asistente INBOTF</h6>
                <small>Productos, stock y ventas</small>
            </div>
            <button type="button" id="inbotf-chat-close" aria-label="Cerrar chat">&times;</button>
        </div>
        <div id="inbotf-chat-messages"></div>
        <div id="inbotf-chat-typing">Escribiendo respuesta...</div>
        <div id="inbotf-chat-chips">
            <button type="button" data-chip="ayuda">Ayuda</button>
            <button type="button" data-chip="buscar ">Buscar</button>
            <button type="button" data-chip="stock bajo">Stock bajo</button>
            <button type="button" data-chip="ventas de hoy">Ventas hoy</button>
            <button type="button" data-chip="identificar producto">Foto producto</button>
        </div>
        <form id="inbotf-chat-form">
            <input type="file" id="inbotf-chat-file" accept="image/*" capture="environment">
            <button type="button" id="inbotf-chat-image-btn" title="Enviar foto"><i class="bi bi-camera"></i></button>
            <input type="text" id="inbotf-chat-input" placeholder="Escribe tu consulta..." autocomplete="off">
            <button type="submit" id="inbotf-chat-send">Enviar</button>
        </form>
    </div>
</div>

<script>
(function () {
    const MOBILE_API = '/mobile-api/';
    const SESSION_KEY = 'inbotfChatSessionId';

    const panel = document.getElementById('inbotf-chat-panel');
    const toggle = document.getElementById('inbotf-chat-toggle');
    const closeBtn = document.getElementById('inbotf-chat-close');
    const messagesEl = document.getElementById('inbotf-chat-messages');
    const form = document.getElementById('inbotf-chat-form');
    const input = document.getElementById('inbotf-chat-input');
    const sendBtn = document.getElementById('inbotf-chat-send');
    const fileInput = document.getElementById('inbotf-chat-file');
    const imageBtn = document.getElementById('inbotf-chat-image-btn');
    const typingEl = document.getElementById('inbotf-chat-typing');

    let sessionId = sessionStorage.getItem(SESSION_KEY);
    let initializing = false;

    function getToken() {
        return localStorage.getItem('authToken');
    }

    function appendMessage(role, text, imageUrl) {
        const div = document.createElement('div');
        div.className = 'inbotf-chat-msg ' + role;
        div.textContent = text || '';
        if (imageUrl) {
            const img = document.createElement('img');
            img.src = imageUrl;
            img.alt = 'Imagen enviada';
            div.appendChild(img);
        }
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function appendSystem(text) {
        const div = document.createElement('div');
        div.className = 'inbotf-chat-msg system';
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderHistory(mensajes) {
        messagesEl.innerHTML = '';
        if (!mensajes || !mensajes.length) {
            appendSystem('Pregunta por productos, stock o ventas del día.');
            return;
        }
        mensajes.forEach(function (m) {
            appendMessage(m.rol === 'user' ? 'user' : 'bot', m.texto || '', m.imagen_url || null);
        });
    }

    async function mobileFetch(path, options) {
        const token = getToken();
        if (!token) {
            throw new Error('Debes iniciar sesión para usar el asistente.');
        }
        const headers = Object.assign({}, (options && options.headers) || {});
        headers['Authorization'] = 'Token ' + token;
        const response = await fetch(MOBILE_API + path, Object.assign({}, options || {}, { headers: headers }));
        if (response.status === 401) {
            throw new Error('Sesión expirada. Vuelve a iniciar sesión.');
        }
        if (!response.ok) {
            let detail = 'No se pudo contactar al asistente.';
            try {
                const err = await response.json();
                detail = err.detail || err.error || JSON.stringify(err);
            } catch (e) { /* ignore */ }
            throw new Error(detail);
        }
        return response.json();
    }

    async function ensureSession() {
        if (sessionId) {
            return sessionId;
        }
        if (initializing) {
            return null;
        }
        initializing = true;
        try {
            const data = await mobileFetch('chat/sessions/iniciar/', { method: 'POST' });
            sessionId = data.session.id;
            sessionStorage.setItem(SESSION_KEY, String(sessionId));
            renderHistory(data.session.mensajes || []);
            return sessionId;
        } finally {
            initializing = false;
        }
    }

    async function loadSessionHistory() {
        if (!sessionId) {
            return ensureSession();
        }
        const data = await mobileFetch('chat/sessions/' + sessionId + '/');
        renderHistory(data.mensajes || []);
        return sessionId;
    }

    async function sendText(text) {
        const id = await ensureSession();
        if (!id) return;
        appendMessage('user', text);
        typingEl.style.display = 'block';
        sendBtn.disabled = true;
        try {
            const data = await mobileFetch('chat/sessions/' + id + '/mensaje/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ texto: text }),
            });
            appendMessage('bot', data.bot_message.texto);
        } finally {
            typingEl.style.display = 'none';
            sendBtn.disabled = false;
        }
    }

    async function sendImage(file) {
        const id = await ensureSession();
        if (!id || !file) return;
        appendMessage('user', '[Foto enviada]');
        typingEl.style.display = 'block';
        sendBtn.disabled = true;
        try {
            const body = new FormData();
            body.append('imagen', file);
            const data = await mobileFetch('chat/sessions/' + id + '/mensaje/', {
                method: 'POST',
                body: body,
            });
            appendMessage('bot', data.bot_message.texto);
        } finally {
            typingEl.style.display = 'none';
            sendBtn.disabled = false;
            fileInput.value = '';
        }
    }

    async function openChat() {
        panel.classList.add('open');
        if (!getToken()) {
            messagesEl.innerHTML = '';
            appendSystem('Inicia sesión en el sistema para usar el chat.');
            return;
        }
        try {
            await loadSessionHistory();
        } catch (err) {
            appendSystem(err.message);
        }
    }

    function closeChat() {
        panel.classList.remove('open');
    }

    toggle.addEventListener('click', function () {
        if (panel.classList.contains('open')) {
            closeChat();
        } else {
            openChat();
        }
    });
    closeBtn.addEventListener('click', closeChat);

    form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const text = (input.value || '').trim();
        if (!text) return;
        input.value = '';
        try {
            await sendText(text);
        } catch (err) {
            appendSystem(err.message);
        }
    });

    imageBtn.addEventListener('click', function () {
        fileInput.click();
    });

    fileInput.addEventListener('change', async function () {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        try {
            await sendImage(file);
        } catch (err) {
            appendSystem(err.message);
        }
    });

    document.querySelectorAll('#inbotf-chat-chips button').forEach(function (btn) {
        btn.addEventListener('click', async function () {
            const chip = btn.getAttribute('data-chip') || '';
            if (chip === 'buscar ') {
                input.focus();
                input.value = 'buscar ';
                input.setSelectionRange(input.value.length, input.value.length);
                return;
            }
            try {
                await sendText(chip);
            } catch (err) {
                appendSystem(err.message);
            }
        });
    });

    window.InbotfChat = {
        open: openChat,
        close: closeChat,
        reset: function () {
            sessionStorage.removeItem(SESSION_KEY);
            sessionId = null;
            messagesEl.innerHTML = '';
        },
    };
})();
</script>
