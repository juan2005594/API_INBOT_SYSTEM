<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-container {
            background: #fff;
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.10);
            width: 100%;
            max-width: 400px;
        }
        .login-title {
            text-align: center;
            margin-bottom: 2rem;
            color: #4CAF50;
            font-weight: bold;
        }
        .form-label {
            font-weight: 500;
        }
        .form-control:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 0.2rem rgba(76,175,80,.25);
        }
        .btn-primary {
            background-color: #4CAF50;
            border: none;
        }
        .btn-primary:hover {
            background-color: #388e3c;
        }
        .error-message {
            color: #d32f2f;
            background: #ffebee;
            border: 1px solid #ffcdd2;
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2 class="login-title">Iniciar Sesión</h2>
        <div id="error-message" class="error-message" style="display:none;"></div>
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
    </div>
    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/api/';

        function setAuthToken(token, username, groups) {
            localStorage.setItem('authToken', token);
            localStorage.setItem('username', username);
            localStorage.setItem('userGroups', JSON.stringify(groups));
        }

        function getAuthToken() {
            return localStorage.getItem('authToken');
        }

        // Si ya hay token, redirige al dashboard
        if (getAuthToken()) {
            window.location.href = '/dashboard/';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            document.getElementById('error-message').style.display = 'none';
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            try {
                const response = await fetch(API_BASE_URL + 'login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                if (!response.ok) {
                    let errorData = {};
                    try { errorData = await response.json(); } catch {}
                    throw new Error(errorData.error || 'Credenciales inválidas');
                }
                const data = await response.json();
                setAuthToken(data.token, data.username, data.groups);
                window.location.href = '/dashboard/';
            } catch (error) {
                const errorDiv = document.getElementById('error-message');
                errorDiv.innerText = error.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
