{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, rgba(76,175,80,0.12), rgba(0,123,255,0.10), rgba(76,175,80,0.08));
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-container {
            background: #fff;
            padding: 0;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
        .login-header {
            padding: 1.6rem 1.6rem 1.2rem 1.6rem;
            background: linear-gradient(135deg, rgba(76,175,80,0.95), rgba(40,167,69,0.85));
            color: #fff;
            text-align: center;
        }
        .login-header .login-logo {
            margin-bottom: 0.9rem;
        }
        .login-subtitle {
            margin-top: 0.25rem;
            margin-bottom: 0;
            opacity: 0.95;
            font-weight: 600;
        }
        .login-title {
            text-align: center;
            margin: 1.7rem 1.6rem 0.2rem 1.6rem;
            color: #4CAF50;
            font-weight: bold;
        }
        .form-label {
            font-weight: 500;
        }
        .form-control:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 0 0.2rem rgba(76,175,80,.25);
        }
        .btn-primary {
            background-color: #4CAF50;
            border: none;
        }
        .btn-primary:hover {
            background-color: #388e3c;
        }
        .error-message {
            color: #d32f2f;
            background: #ffebee;
            border: 1px solid #ffcdd2;
            border-radius: 6px;
            padding: 0.75rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .login-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            gap: 12px;
        }
        .login-logo img {
            width: 56px;
            height: 56px;
            object-fit: contain;
        }
        .login-logo-fallback {
            display: none;
            font-weight: bold;
            color: #4CAF50;
            letter-spacing: 0.5px;
        }
        .login-body {
            padding: 0 1.6rem 1.6rem 1.6rem;
        }
        .btn-primary {
            background-color: #4CAF50;
            border: none;
            border-radius: 10px;
            padding: 0.7rem 1rem;
            font-weight: 700;
        }
        .btn-primary:hover {
            background-color: #388e3c;
        }
        .login-footer-note {
            margin-top: 0.9rem;
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-logo">
                <img
                    src="{% static 'images/logo.png' %}"
                    alt="Logo"
                    onerror="this.style.display='none';var el=document.getElementById('login-logo-fallback'); if(el) el.style.display='block';"
                />
                <span id="login-logo-fallback" class="login-logo-fallback">LOGO</span>
            </div>
            <h2 class="login-title" style="margin:0; color:#fff;">INBOTF_SYSTEM</h2>
            <p class="login-subtitle">Sistema de Inventario</p>
        </div>

        <div class="login-body">
            <h2 class="login-title" style="margin: 1.2rem 0 0.2rem 0; color:#4CAF50;">Iniciar Sesión</h2>
            <div id="error-message" class="error-message" style="display:none;"></div>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
                <div class="login-footer-note">Acceso seguro mediante token.</div>
            </form>
        </div>
    </div>
    <script>
        const API_BASE_URL = '/core-api/';

        function setAuthToken(token, username, groups) {
            localStorage.setItem('authToken', token);
            localStorage.setItem('username', username);
            localStorage.setItem('userGroups', JSON.stringify(groups));
        }

        function getAuthToken() {
            return localStorage.getItem('authToken');
        }

        // Si ya hay token, redirige al dashboard
        if (getAuthToken()) {
            window.location.href = '/dashboard/';
        }

        document.getElementById('loginForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            document.getElementById('error-message').style.display = 'none';
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            try {
                const response = await fetch(API_BASE_URL + 'login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password })
                });
                if (!response.ok) {
                    let errorData = {};
                    try { errorData = await response.json(); } catch {}
                    throw new Error(errorData.error || 'Credenciales inválidas');
                }
                const data = await response.json();
                setAuthToken(data.token, data.username, data.groups);
                window.location.href = '/dashboard/';
            } catch (error) {
                const errorDiv = document.getElementById('error-message');
                errorDiv.innerText = error.message;
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
